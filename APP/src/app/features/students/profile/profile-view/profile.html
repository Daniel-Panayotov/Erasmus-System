<div class="page-container">
  <div class="profile">
    @if (student(); as s) {
      <span>{{ s.studentID }}</span>
      <span>{{ s.dataDTO.firstName }}</span>
      <span>{{ s.dataDTO.lastName }}</span>
      <span>{{ s.dataDTO.gender }}</span>
      <span>{{ s.dataDTO.birthDate }}</span>
      <span>{{ s.dataDTO.nationality }}</span>
      <span>{{ s.dataDTO.address }}</span>
      <span>{{ s.dataDTO.phoneNumber }}</span>
    }
  </div>
</div>
