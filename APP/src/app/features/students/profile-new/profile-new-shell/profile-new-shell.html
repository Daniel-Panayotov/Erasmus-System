<div class="page-container">
  <mat-tab-group
    fitInkBarToContent
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    [selectedIndex]="tabIndex()"
    (selectedIndexChange)="navigate($event)"
  >
    <mat-tab label="Create profile" />
    <mat-tab label="Language competencies" />
    <mat-tab labelClass="phantom-tab" [disabled]="true" />
  </mat-tab-group>

  <div class="outlet-container">
    <router-outlet />
  </div>
</div>
