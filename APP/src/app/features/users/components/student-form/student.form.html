<div class="main-container">
  <h1 class="form-title">Student Form</h1>
  <form [formRoot]="studentForm">
    <div class="form-controls">
      <!-- First name -->
      <div class="control-container">
        <label for="first-name">First Name *</label>
        <input
          type="text"
          id="first-name"
          placeholder="Peter"
          [formField]="studentForm.FirstName"
        />
      </div>
      <!-- Last name -->
      <div class="control-container">
        <label for="last-name">Last Name *</label>
        <input type="text" id="last-name" placeholder="Ivanov" [formField]="studentForm.LastName" />
      </div>
      <!-- Birth date -->
      <div class="control-container">
        <label for="birth-date">Birth date *</label>
        <input type="date" id="birth-date" [formField]="studentForm.BirthDate" />
      </div>
      <!-- Gender radio -->
      <div class="control-container">
        <fieldset>
          <legend>Gender *</legend>
          <div class="radio-group">
            <input type="radio" id="gender1" value="Male" [formField]="studentForm.Gender" />
            <label for="gender1">Male</label>
          </div>
          <div class="radio-group">
            <input type="radio" id="gender2" value="Female" [formField]="studentForm.Gender" />
            <label for="gender2">Female</label>
          </div>
        </fieldset>
      </div>
      <!-- Nationality -->
      <div class="control-container">
        <label for="nationality">Nationality *</label>
        <input
          type="text"
          id="nationality"
          placeholder="Bulgaria"
          [formField]="studentForm.Nationality"
        />
      </div>
      <!-- Address -->
      <div class="control-container">
        <label for="address">Address *</label>
        <input
          type="text"
          id="address"
          placeholder="Ruse, cherry street, 12"
          [formField]="studentForm.Address"
        />
      </div>
      <!-- Phone Number -->
      <div class="control-container">
        <label for="phone">Phone Number *</label>
        <input
          type="text"
          id="phone"
          placeholder="+892361569"
          [formField]="studentForm.PhoneNumber"
        />
      </div>
    </div>

    <button class="bg-green button" type="submit" [disabled]="studentForm().invalid()">
      Submit
    </button>
  </form>
</div>
