<section class="h-full">
  <div class="h-full flex flex-col items-center justify-center px-6 py-8">
    <div class="w-full rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight">
          {{ isLogin() ? "Log into your account" : "Register" }}
        </h1>
        <form class="space-y-4 md:space-y-6" [formRoot]="authForm">
          <div>
            <label for="email" class="block mb-2 text-sm font-medium">
                Your email
            </label>
            <input
              type="email"
              id="email"
              class="border rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"
              placeholder="name@company.com"
              [formField]="authForm.email"
            />
          </div>
          <div>
            <label
              for="password"
              class="block mb-2 text-sm font-medium"
              >Password</label
            >
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              class="border rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"
              [formField]="authForm.password"
            />
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input
                  id="remember"
                  aria-describedby="remember"
                  type="checkbox"
                  class="w-4 h-4 border rounded"
                  required=""
                />
              </div>
              <div class="ml-3 text-sm">
                <label for="remember">Remember me</label>
              </div>
            </div>
            @if (isLogin()) {
              <a
                href="#"
                class="text-sm font-medium text-primary-600 hover:underline">
                Forgot password?
              </a>
            }
          </div>
          <button
            [disabled]="authForm().invalid()" 
            type="submit"
            class="submit-btn cursor-pointer border w-full bg-primary-600  focus:ring-4 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
          >
            Sign in
          </button>
          <p class="text-sm font-light">
            {{ isLogin() ?  "Don’t have an account yet?" : "Have an account?"}}            
            <a [routerLink]="isLogin() ? '/register' : '/login'" class="font-medium text-primary-600 hover:underline">
                {{ isLogin() ?  "Register" : "Login"}}
            </a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
