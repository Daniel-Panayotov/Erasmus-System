<div class="table-page-container">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input />
  </mat-form-field>

  <div class="table-shell">
    <div class="scroll-area">
      <table mat-table [dataSource]="dataSource" matSort>
        @for (col of columns(); track $index) {
          <ng-container [matColumnDef]="col.field">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ col.label }}</th>
            <td mat-cell *matCellDef="let element">{{ element[col.field] }}</td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="headerDefs()"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: headerDefs()"
          (click)="selectRow(row)"
          [class.row-clicked]="clickedRow() == row"
        ></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
        </tr>
      </table>
      <div class="button-row">
        <button matButton="outlined" [routerLink]="urls().create()">Create</button>
        <button
          matButton="outlined"
          [disabled]="!clickedRow()"
          [routerLink]="clickedRow() == null ? '' : urls().update(clickedRow())"
        >
          Update
        </button>
        <button
          matButton="outlined"
          [disabled]="!clickedRow()"
          (click)="deleteHandler()(clickedRow)"
        >
          Delete
        </button>
      </div>
    </div>
    <mat-paginator [pageSizeOptions]="[5, 10]" />
  </div>
</div>
