<div class="table-page-container">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input />
  </mat-form-field>

  <div class="table-shell">
    <div class="scroll-area">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="languageCompetencyID">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let element">{{ element.languageCompetencyID }}</td>
        </ng-container>

        <ng-container matColumnDef="language">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Language</th>
          <td mat-cell *matCellDef="let element">{{ element.language }}</td>
        </ng-container>

        <ng-container matColumnDef="canFollowLectures">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Can Follow Lectures</th>
          <td mat-cell *matCellDef="let element">{{ element.canFollowLectures }}</td>
        </ng-container>

        <ng-container matColumnDef="canFollowLecturesWithLessons">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Can Follow Lectures With Lessons
          </th>
          <td mat-cell *matCellDef="let element">{{ element.canFollowLecturesWithLessons }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: columnsToDisplay"
          (click)="selectRow(row)"
          [class.row-clicked]="clickedRow() == row"
        ></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
        </tr>
      </table>
      <div class="button-row">
        <button
          matButton="outlined"
          [routerLink]="studentsPaths.languageCompetenciesCreate(studentID())"
        >
          Add
        </button>
        <button
          matButton="outlined"
          [disabled]="!clickedRow()"
          [routerLink]="
            studentsPaths.languageCompetencyUpdate(
              this.studentID(),
              this.clickedRow()?.languageCompetencyID?.toString()!
            )
          "
        >
          Edit
        </button>
        <button matButton="outlined" [disabled]="!clickedRow()" (click)="deleteCompetency()">
          Delete
        </button>
      </div>
    </div>
    <mat-paginator [pageSizeOptions]="[5, 10]" />
  </div>
</div>
