<div class="table-page-container">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input />
  </mat-form-field>

  <div class="table-shell">
    <div class="scroll-area">
      <table
        mat-table
        [dataSource]="tableSource"
        matSort
        cdkDropList
        [cdkDropListData]="dropListSource"
        (cdkDropListDropped)="drop($event)"
      >
        @for (col of columns(); track $index) {
          <ng-container [matColumnDef]="col.field">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ col.label }}</th>
            <td mat-cell *matCellDef="let element">{{ element[col.field] }}</td>
          </ng-container>
        }

        <mat-header-row *matHeaderRowDef="headerDefs()"></mat-header-row>
        <mat-row
          *matRowDef="let row; columns: headerDefs()"
          cdkDrag
          cdkDragData="row"
          (click)="selectRow(row)"
          [class.row-clicked]="clickedRow() == row"
        ></mat-row>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
        </tr>
      </table>
    </div>
    <div class="button-container">
      <div class="button-row">
        @for (button of buttons(); track $index) {
          <button
            matButton="outlined"
            [disabled]="button.disabled?.(clickedRow) ?? false"
            [routerLink]="button.url?.(clickedRow()) ?? null"
            (click)="button.handler?.(clickedRow) ?? null"
          >
            {{ button.label }}
          </button>
        }
      </div>
    </div>
  </div>
  <mat-paginator [pageSizeOptions]="[5, 10]" />
</div>
