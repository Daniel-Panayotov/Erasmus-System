<h2 mat-dialog-title>You have unsaved changes!</h2>
<mat-dialog-content class="mat-typography">
  <p>Would you like to continue with the form?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="close()">Close</button>
  <button matButton (click)="continue()">Continue</button>
</mat-dialog-actions>
