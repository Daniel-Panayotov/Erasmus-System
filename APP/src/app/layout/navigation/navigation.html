<nav class="navbar">
  <a class="nav-logo" routerLink="/">
    <div class="nav-logo-mark"><h1>Home</h1></div>
  </a>

  @if (authenticated()) {
    <div class="nav-links">
      <a class="nav-link" [routerLink]="'/users/profile/update/' + studentID">Profile update</a>
      <a class="nav-link" routerLink="/users/profile/create">Profile create</a>
      <a class="nav-link" routerLink="/users/apply">Apply</a>
    </div>
  }

  <div class="nav-right">
    @if (!authenticated()) {
      <a class="nav-btn-ghost" routerLink="/auth/login">Login</a>
      <a class="nav-btn-ghost" routerLink="/auth/register">Register</a>
    } @else {
      <button class="cursor-pointer" (click)="logout()">Logout</button>
    }
  </div>
</nav>
